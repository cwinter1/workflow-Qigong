<script>
// ═══════════════════════════════════════════════════════
// PALETTE & THEME — B · Restore · Dark (shared design system)
// ═══════════════════════════════════════════════════════
const T = {
  bg:      '#0e1116',
  fg:      '#e8e5dd',
  sub:     '#8a8478',
  card:    '#16191e',
  cardLine:'rgba(255,255,255,0.06)',
  accent:  '#7aa676',
  accentT: '#0e1116',
  hairline:'rgba(255,255,255,0.12)',

  pill:    'rgba(255,255,255,0.06)',
  display: '"Space Grotesk", system-ui, sans-serif',

// ═══════════════════════════════════════════════════════
// UTILITY
// ═══════════════════════════════════════════════════════
function el(tag, style) {
  const e = document.createElement(tag);
  if (style) e.style.cssText = style;
  return e;
}
function sectionHeader(text) {
  const h = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.mono};letter-spacing:2px;text-transform:uppercase;`);
  h.textContent = text;
  return h;
}
function renderStat(key, val) {
  const row = el('div', `display:flex;justify-content:space-between;align-items:center;padding:16px;background:${T.card};border:1px solid ${T.hairline};border-radius:6px;`);
  const k = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};letter-spacing:1.5px;text-transform:uppercase;`);
  k.textContent = key;
  const v = el('div', `font-family:${T.display};font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.5px;`);
  v.textContent = val;
  row.append(k, v);
  return row;
}
function fmt(s) {
  if (s < 0) s = 0;
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ═══════════════════════════════════════════════════════
// LANGUAGE — English by default, Hebrew on request (toggle button).
// t(he, en) picks the string for the active language. Choice is saved under
// 'qf.lang'. Hebrew keeps the original right-to-left layout.
// ═══════════════════════════════════════════════════════
let LANG = 'en';
try { const l = localStorage.getItem('qf.lang'); if (l === 'he' || l === 'en') LANG = l; } catch {}
function t(he, en) { return LANG === 'en' ? en : he; }
function applyLang() {
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'he' ? 'rtl' : 'ltr';
  document.title = t('Q·Flow · כריס', 'Q·Flow · Chris');
}
function setLang(l) {
  LANG = l;
  try { localStorage.setItem('qf.lang', l); } catch {}
  applyLang();
  render();
}
function langButton() {
  const b = el('button', `appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.fg};border-radius:6px;padding:8px 12px;font-family:${T.mono_ff};font-size:11px;letter-spacing:1.5px;flex-shrink:0;`);
  b.textContent = LANG === 'en' ? 'עברית' : 'English';
  b.setAttribute('aria-label', LANG === 'en' ? 'Switch to Hebrew' : 'Switch to English');
  b.onclick = () => setLang(LANG === 'en' ? 'he' : 'en');
  return b;
}
function variantText(v) {
  if (LANG === 'he') return v;
  return v.replace(/(\d+) חזרות/, '$1 reps').replace(/(\d+) לכל צד/, '$1 each side');
}
function exName(ex)      { return LANG === 'en' ? ex.nameEn : ex.name; }
function curName(c)      { return LANG === 'en' ? c.exNameEn : c.exName; }
function phaseNameOf(c)  { return LANG === 'en' ? c.phaseNameEn : c.phaseName; }
function phaseIntent(c)  { return LANG === 'en' ? c.intentEn : c.intent; }
function dayTitle(d)     { return t(d.title, d.titleEn); }

// ═══════════════════════════════════════════════════════
// ICONS
// ═══════════════════════════════════════════════════════
function iconPlay(c)  { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="${c}"><polygon points="3,1 13,7 3,13"/></svg>`; }
function iconPause(c) { return `<svg width="14" height="16" viewBox="0 0 14 16" fill="${c}"><rect x="1" y="1" width="4" height="14" rx="1"/><rect x="9" y="1" width="4" height="14" rx="1"/></svg>`; }
function iconNext(c)  { return `<svg width="14" height="14" viewBox="0 0 14 14" fill="${c}" stroke="${c}" stroke-width="1"><polygon points="2,1 10,7 2,13"/><rect x="11" y="1" width="2" height="12" rx="1"/></svg>`; }
function iconCheck(c) { return `<svg width="16" height="16" viewBox="0 0 16 16" stroke="${c}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,8 6,12 14,4"/></svg>`; }
function iconClose(c) { return `<svg width="14" height="14" viewBox="0 0 14 14" stroke="${c}" stroke-width="1.5" fill="none" stroke-linecap="round"><line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/></svg>`; }
function iconArrow(c) { return `<svg width="16" height="16" viewBox="0 0 16 16" stroke="${c}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,4 10,8 6,12"/></svg>`; }
function iconSpeaker(c) { return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="${c}" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>`; }
function iconStop(c) { return `<svg width="12" height="12" viewBox="0 0 12 12" fill="${c}"><rect x="1" y="1" width="10" height="10" rx="1.5"/></svg>`; }

// Search query stays in English (nameEn) — most Baduanjin tutorials are in
// English/Chinese, so an English query surfaces better results than a
// Hebrew one for a Chinese-origin movement name.
function youtubeSearchUrl(nameEn) {
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(nameEn + ' baduanjin qigong')}`;
}

// ═══════════════════════════════════════════════════════
// CLIPS — one short demo per movement (plus an alternative).
// Every id in BADUANJIN_PHASES was checked against YouTube's oEmbed (exists,
// embeddable) and its title names the movement. The page cannot read a
// video's length ahead of time, so the player is capped at CLIP_MAX seconds
// (YouTube's `end` parameter) and shows the real length once it loads.
// ═══════════════════════════════════════════════════════
const CLIP_MAX = 60;
let _ytApiPromise = null;
function loadYtApi() {
  if (window.YT && window.YT.Player) return Promise.resolve();
  if (_ytApiPromise) return _ytApiPromise;
  _ytApiPromise = new Promise(res => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { try { if (prev) prev(); } catch {} res(); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => res();
    document.head.appendChild(s);
    setTimeout(res, 8000);
  });
  return _ytApiPromise;
}

function renderClip(clips) {
  let cur = 0, player = null;
  const wrap = el('div', `display:flex;flex-direction:column;gap:8px;`);
  const stage = el('div', `position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;`);
  const info = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};letter-spacing:0.5px;line-height:1.5;`);
  const links = el('div', `display:flex;gap:8px;flex-wrap:wrap;`);

  const linkStyle = `appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.fg};border-radius:6px;padding:8px 12px;font-family:${T.mono_ff};font-size:11px;letter-spacing:1px;text-decoration:none;`;
  const ytLink = el('a', linkStyle);
  ytLink.target = '_blank'; ytLink.rel = 'noopener';
  ytLink.textContent = t('פתח ב-YouTube', 'Open on YouTube');
  links.appendChild(ytLink);
  let altBtn = null;
  if (clips.length > 1) {
    altBtn = el('button', linkStyle);
    altBtn.textContent = t('קליפ אחר', 'Another clip');
    altBtn.onclick = () => { cur = (cur + 1) % clips.length; showPoster(); };
    links.appendChild(altBtn);
  }

  function killPlayer() { if (player) { try { player.destroy(); } catch {} player = null; } }

  function showPoster() {
    killPlayer();
    const id = clips[cur];
    stage.innerHTML = '';
    ytLink.href = `https://www.youtube.com/watch?v=${id}`;
    const img = el('img', `position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.85;`);
    img.src = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    img.alt = '';
    img.onerror = () => { img.style.display = 'none'; };
    const btn = el('button', `position:absolute;inset:0;width:100%;height:100%;appearance:none;border:none;background:transparent;display:flex;align-items:center;justify-content:center;`);
    btn.setAttribute('aria-label', t('נגן קליפ', 'Play clip'));
    const circle = el('span', `width:56px;height:56px;border-radius:50%;background:${T.accent};display:flex;align-items:center;justify-content:center;`);
    circle.innerHTML = iconPlay(T.accentT);
    btn.appendChild(circle);
    btn.onclick = play;
    stage.append(img, btn);
    const n = clips.length > 1 ? ` (${cur + 1}/${clips.length})` : '';
    info.textContent = t(`הקש לניגון. הנגן עוצר אחרי דקה.${n}`, `Tap to play. The player stops after 1 minute.${n}`);
  }

  function play() {
    const id = clips[cur];
    killPlayer();
    stage.innerHTML = '';
    const holder = el('div', `position:absolute;inset:0;`);
    stage.appendChild(holder);
    info.textContent = t('טוען...', 'Loading...');
    loadYtApi().then(() => {
      if (!(window.YT && window.YT.Player)) {
        const f = el('iframe', `width:100%;height:100%;border:none;`);
        f.src = `https://www.youtube.com/embed/${id}?autoplay=1&playsinline=1&rel=0&modestbranding=1&end=${CLIP_MAX}`;
        f.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
        holder.appendChild(f);
        info.textContent = '';
        return;
      }
      const d = el('div', `width:100%;height:100%;`);
      holder.appendChild(d);
      player = new window.YT.Player(d, {
        width: '100%', height: '100%', videoId: id,
        playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, fs: 0, start: 0, end: CLIP_MAX },
        events: {
          onStateChange: ev => {
            if (ev.data === 1 && player && player.getDuration) {
              const dur = Math.round(player.getDuration());
              if (dur > 0) {
                info.textContent = dur > CLIP_MAX
                  ? t(`הסרטון המלא ${fmt(dur)}. מתנגנת רק הדקה הראשונה.`, `Full video is ${fmt(dur)}. Only the first minute plays.`)
                  : t(`אורך הקליפ ${fmt(dur)}.`, `Clip length ${fmt(dur)}.`);
              }
            }
          },
          onError: () => { info.textContent = t('הקליפ לא זמין כאן. פתחו ב-YouTube או נסו קליפ אחר.', 'This clip is not available here. Open it on YouTube or try another clip.'); },
        },
      });
    });
  }

  showPoster();
  loadYtApi();
  wrap.append(stage, info, links);
  return wrap;
}

// Toggle: tap once to start reading, tap again (or navigate away) to stop
// immediately rather than waiting for the utterance to finish on its own.
let _speakingBtn = null;
function toggleSpeech(text, btn) {
  if (!('speechSynthesis' in window)) return;
  const wasThisBtn = _speakingBtn === btn;
  try { window.speechSynthesis.cancel(); } catch {}
  if (_speakingBtn) { _speakingBtn.innerHTML = iconSpeaker(T.fg); _speakingBtn = null; }
  if (wasThisBtn) return;
  try {
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = LANG === 'he' ? 'he-IL' : 'en-US';
    utter.rate = 0.92;
    const reset = () => { if (_speakingBtn === btn) { btn.innerHTML = iconSpeaker(T.fg); _speakingBtn = null; } };
    utter.onend = reset;
    utter.onerror = reset;
    btn.innerHTML = iconStop(T.fg);
    _speakingBtn = btn;
    window.speechSynthesis.speak(utter);
  } catch {}
}

  days: [

// ═══════════════════════════════════════════════════════
// MOVEMENT ILLUSTRATIONS — simple built-in stick-figure diagrams.
// No video: no ads, no intros, no loading, works offline, shows instantly.
// ═══════════════════════════════════════════════════════
function svgFigure(inner) {
  return `<svg viewBox="0 0 100 140" width="100%" height="180" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;">${inner}</svg>`;
}
// frames (optional): a single point-string, or an array of them for movements
// that alternate sides (e.g. punch left, then punch right). The polyline loops
// base→frame1→base→frame2→base... via native SVG SMIL — no JS/CSS keyframes,
// works in Safari.
function bone(basePts, color, frames, dur) {
  let anim = '';
  if (frames) {
    const list = Array.isArray(frames) ? frames : [frames];
    const values = [basePts, ...list.flatMap(f => [f, basePts])].join(';');
    anim = `<animate attributeName="points" values="${values}" dur="${dur || '2.6s'}" repeatCount="indefinite"/>`;
  }
  return `<polyline points="${basePts}" fill="none" stroke="${color}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">${anim}</polyline>`;
}
function headC(baseCx, baseCy, color, framesCx, framesCy, dur) {
  let animX = '', animY = '';
  if (framesCx != null) {
    const listX = Array.isArray(framesCx) ? framesCx : [framesCx];
    const listY = Array.isArray(framesCy) ? framesCy : [framesCy];
    const valuesX = [baseCx, ...listX.flatMap(v => [v, baseCx])].join(';');
    const valuesY = [baseCy, ...listY.flatMap(v => [v, baseCy])].join(';');
    animX = `<animate attributeName="cx" values="${valuesX}" dur="${dur || '2.6s'}" repeatCount="indefinite"/>`;
    animY = `<animate attributeName="cy" values="${valuesY}" dur="${dur || '2.6s'}" repeatCount="indefinite"/>`;
  }
  return `<circle cx="${baseCx}" cy="${baseCy}" r="9" fill="none" stroke="${color}" stroke-width="4">${animX}${animY}</circle>`;
}
function groundLine() {
  return `<line x1="15" y1="132" x2="85" y2="132" stroke="${T.hairline}" stroke-width="2" stroke-linecap="round"/>`;
}
const LEGS_NARROW = () => bone('50,75 43,105 40,130', T.fg) + bone('50,75 57,105 60,130', T.fg);
const LEGS_HORSE  = () => bone('50,75 30,100 22,130', T.fg) + bone('50,75 70,100 78,130', T.fg);

// On the timer screen (animated=true) the figure loops neutral→pose(s)→neutral
// via SMIL so there's something to move with in real time — the full range of
// the movement, both sides when the exercise alternates. On the preview screen
// (animated=false/undefined) it's a single static reference pose (frames[0]).
function movingBone(neutralPts, activeFrames, color, animated, dur) {
  if (!animated) return bone(Array.isArray(activeFrames) ? activeFrames[0] : activeFrames, color);
  return bone(neutralPts, color, activeFrames, dur);
}
function movingHead(nCx, nCy, activeCxFrames, activeCyFrames, color, animated, dur) {
  if (!animated) {
    const cx = Array.isArray(activeCxFrames) ? activeCxFrames[0] : activeCxFrames;
    const cy = Array.isArray(activeCyFrames) ? activeCyFrames[0] : activeCyFrames;
    return headC(cx, cy, color);
  }
  return headC(nCx, nCy, color, activeCxFrames, activeCyFrames, dur);
}

function phaseSeconds(totalMin) {
  const s = PROGRAM.phaseShare, total = totalMin * 60;
  const out = {};
  Object.keys(s).forEach(id => { out[id] = Math.round(total * s[id]); });
  return out;
}

function buildTimeline(dayIdx, week, totalMin) {
  const day = PROGRAM.days[dayIdx];
  const totals = phaseSeconds(totalMin);
  const out = [];
  day.phases.forEach((ph, pi) => {
    const each = Math.max(20, Math.round(totals[ph.id] / ph.exercises.length));
    ph.exercises.forEach((ex, ei) => {
      out.push({ phaseIdx:pi, phaseId:ph.id, phaseName:ph.name, phaseNameEn:ph.nameEn, intent:ph.intent, intentEn:ph.intentEn,
        exIdx:ei, exName:ex.name, exNameEn:ex.nameEn, clips:ex.clips || [], variant:ex.variants[week-1], seconds:each, kind:'exercise' });
    });
  });
  return out;
}

function loadSessions()  { try { return JSON.parse(localStorage.getItem('qf.sessions') || '[]'); } catch { return []; } }

function getStreak() {
  const sessions = loadSessions();
  if (!sessions.length) return 0;
  const dayKeys = [...new Set(sessions.map(s => {
    const d = new Date(s.at);
    return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
  }))].sort();
  const last = new Date(sessions[sessions.length - 1].at);
  const today = new Date(); today.setHours(0,0,0,0); last.setHours(0,0,0,0);
  if ((today - last) / 86400000 > 1) return 0;
  let streak = 1;
  for (let i = dayKeys.length - 2; i >= 0; i--) {
    const a = dayKeys[i].split('-').map(Number);
    const b = dayKeys[i+1].split('-').map(Number);
    const da = new Date(a[0], a[1], a[2]);
    const db = new Date(b[0], b[1], b[2]);
    if ((db - da) / 86400000 === 1) streak++;
    else break;
  }
  return streak;
}

// ═══════════════════════════════════════════════════════
// SESSION START
// ═══════════════════════════════════════════════════════
function startSession() {
  clearInterval(timerInterval);
  try {
    const ctx = getAudioCtx();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch {}
  state.timeline = buildTimeline(state.day, state.week, SESSION_MIN);
  state.idx = 0;
  state.left = state.timeline[0].seconds;
  state.paused = false;
  state.startedAt = Date.now();
  state.view = 'preview';
  acquireWakeLock();
  render();
}

function pickDay(w, d) {
  state.week = w; state.day = d;
  startSession();
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (state.paused) return;
    state.left--;
    if (state.left <= 0) {
      clearInterval(timerInterval);
      beep();
      if (state.idx + 1 < state.timeline.length) {
        state.idx++;
        state.left = state.timeline[state.idx].seconds;
        state.view = 'preview';
        render();
      } else {
        finishSession();
      }
    } else {
      if (state.left <= 10 && state.left > 0) beepTick(state.left <= 3 ? 880 : 440);
      updateTimerDisplay();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const cur = state.timeline[state.idx];

  const numEl = document.getElementById('timer-num');
  if (numEl) numEl.textContent = fmt(state.left);

  const progEl = document.getElementById('session-prog');
  if (progEl) {
    const totalSec = state.timeline.reduce((a, t) => a + t.seconds, 0);
    const doneSec = state.timeline.slice(0, state.idx).reduce((a, t) => a + t.seconds, 0) + (cur.seconds - state.left);
    progEl.style.width = `${(doneSec / totalSec) * 100}%`;
  }
}

  const sessRight = el('span', ``); sessRight.textContent = t(`נותרו ${fmt(totalSec - doneSec)}`, `${fmt(totalSec - doneSec)} left`);
  progHdr.append(sessLeft, sessRight);
  const progBg = el('div', `height:4px;background:${T.pill};margin-top:6px;`);
  const progFill = el('div', `height:100%;width:${(doneSec/totalSec)*100}%;background:${T.accent};`);
  progFill.id = 'session-prog';
  progBg.appendChild(progFill);
  progWrap.append(progHdr, progBg);

  const rows = [phaseTag, exTitle, variant];
  if (illoBox) rows.push(illoBox);
  rows.push(timerCard, progWrap);
  body.append(...rows);

  root.append(hdr, phaseBars, body, renderControls());
}

function renderControls() {
  const ctrls = el('div', `padding:14px 22px;display:flex;gap:10px;flex-shrink:0;padding-bottom:calc(env(safe-area-inset-bottom,14px)+14px);`);
  const pauseBtn = el('button', `flex:2;appearance:none;border:none;background:${T.fg};color:${T.bg};border-radius:6px;padding:18px;font-family:${T.display};font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:10px;`);
  pauseBtn.id = 'pause-btn';
  pauseBtn.innerHTML = `${state.paused ? iconPlay(T.bg) : iconPause(T.bg)} ${state.paused ? t('המשך', 'Resume') : t('השהה', 'Pause')}`;
  pauseBtn.onclick = togglePause;
  const skipBtn = el('button', `flex:1;appearance:none;background:transparent;border:1px solid ${T.hairline};color:${T.fg};border-radius:6px;padding:18px;font-family:${T.display};font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:8px;`);
  skipBtn.innerHTML = `${iconNext(T.fg)} ${t('דלג', 'Skip')}`;
  skipBtn.onclick = skipExercise;
  ctrls.append(pauseBtn, skipBtn);
  return ctrls;
}

function togglePause() {
  state.paused = !state.paused;
  const btn = document.getElementById('pause-btn');
  if (btn) btn.innerHTML = `${state.paused ? iconPlay(T.bg) : iconPause(T.bg)} ${state.paused ? t('המשך', 'Resume') : t('השהה', 'Pause')}`;
}

function skipExercise() {
  clearInterval(timerInterval);
  if (state.idx + 1 < state.timeline.length) {
    state.idx++;
    state.left = state.timeline[state.idx].seconds;
    state.view = 'preview';
    render();
  } else {
    finishSession();
  }
}

function abortSession() {
  clearInterval(timerInterval);
  releaseWakeLock();
  const ns2 = nextSession();
  state.week = ns2.week; state.day = ns2.day;
  state.view = 'home';
  render();
}

function finishSession() {
  clearInterval(timerInterval);
  releaseWakeLock();
  const key = `w${state.week}d${state.day}`;
  const now = Date.now();
  const duration = state.startedAt ? Math.round((now - state.startedAt) / 1000) : SESSION_MIN * 60;
  state.progress[key] = { done: true, at: now };
  saveProgress();
  const sessions = loadSessions();
  sessions.push({ key, at: now, duration, week: state.week, day: state.day, dayTitle: PROGRAM.days[state.day].title, dayTag: PROGRAM.days[state.day].tag });
  saveSessions(sessions);
  state.lastDuration = duration;
  state.view = 'done';
  render();
}

// ═══════════════════════════════════════════════════════
// DONE
// ═══════════════════════════════════════════════════════
function renderDone(root) {
  const total = Object.keys(state.progress).length;
  const streak = getStreak();
  const duration = state.lastDuration || SESSION_MIN * 60;
  const sessionKey = `w${state.week}d${state.day}`;
  const msg = pickMessage(streak, state.week, total);

  const scroll = el('div', `flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top,12px)+36px) 22px 0;`);
  const body = el('div', `display:flex;flex-direction:column;gap:24px;`);

  const top = el('div', `display:flex;flex-direction:column;gap:10px;`);
  const tag = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.accent};letter-spacing:2px;text-transform:uppercase;`);
  tag.textContent = t('האימון הושלם', 'Session complete');
  const msgDiv = el('div', `font-family:"Instrument Serif",serif;font-size:38px;line-height:1.15;color:${T.fg};font-style:italic;`);
  msgDiv.textContent = msg;
  top.append(tag, msgDiv);

  if (streak >= 2) {
    const badge = el('div', `display:flex;align-items:center;gap:14px;padding:16px 18px;background:${T.card};border:1px solid ${T.accent}44;border-radius:8px;`);
    const num = el('div', `font-family:${T.display};font-size:48px;font-weight:700;color:${T.accent};line-height:1;`);
    num.textContent = streak;
    const right = el('div', ``);
    const lbl = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.accent};letter-spacing:2px;text-transform:uppercase;`);
    lbl.textContent = t('רצף ימים', 'Day streak');
    const sub = el('div', `font-size:13px;color:${T.sub};margin-top:4px;`);
    sub.textContent = streak === 2 ? t('שניים ברצף. תמשיכו כך.', 'Two in a row. Keep going.') :
                      streak === 3 ? t('שלושה ברצף. הדפוס נקבע.', 'Three in a row. The pattern is set.') :
                      streak === 7 ? t('שבוע שלם בלי לפספס.', 'A full week without missing.') :
                      t('אל תשברו את השרשרת.', 'Do not break the chain.');
    right.append(lbl, sub);
    badge.append(num, right);
    body.appendChild(top);
    body.appendChild(badge);
  } else {
    body.appendChild(top);
  }

  const stats = el('div', `display:flex;flex-direction:column;gap:8px;`);
  const durationMin = Math.round(duration / 60);
  [
    [t('משך', 'Duration'), `${durationMin} ${t('דקות', 'min')}`],
    [t('אימון', 'Session'),  t(`שבוע ${state.week} · יום ${state.day + 1}`, `Week ${state.week} · Day ${state.day + 1}`)],
    [t('תוכנית', 'Program'),  t(`${total} מתוך 12 הושלמו`, `${total} of 12 done`)],
  ].forEach(([k, v]) => stats.appendChild(renderStat(k, v)));
  body.appendChild(stats);

  let sessionRating = null;
  const ratingCard = el('div', `background:${T.card};border:1px solid ${T.hairline};border-radius:8px;padding:14px 16px;`);
  const ratingHdr = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.mono};letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;`);
  ratingHdr.textContent = t('כמה מיושב זה הרגיש?', 'How settled did it feel?');
  const ratingRow = el('div', `display:flex;gap:8px;`);
  [1,2,3,4,5].forEach(n => {
    const btn = el('button', `flex:1;appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.sub};border-radius:6px;padding:10px 0;font-family:${T.display};font-weight:700;font-size:18px;`);
    btn.textContent = n;
    btn.onclick = () => {
      sessionRating = n;
      ratingRow.querySelectorAll('button').forEach((b, i) => {
        b.style.background = i + 1 === n ? T.accent : 'transparent';
        b.style.color = i + 1 === n ? T.accentT : T.sub;
        b.style.border = `1px solid ${i + 1 === n ? T.accent : T.hairline}`;
      });
    };
    ratingRow.appendChild(btn);
  });
  ratingCard.append(ratingHdr, ratingRow);
  body.appendChild(ratingCard);

  body.appendChild(el('div', `height:24px;`));
  scroll.appendChild(body);

  const ctaWrap = el('div', `padding:14px 22px;padding-bottom:calc(env(safe-area-inset-bottom,14px)+14px);display:flex;gap:10px;flex-shrink:0;`);

  const shareBtn = el('button', `flex:1;appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.fg};border-radius:6px;padding:18px;font-family:${T.display};font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;`);
  shareBtn.textContent = t('שתף', 'Share');
  shareBtn.onclick = async () => {
    const orig = shareBtn.textContent;
    shareBtn.disabled = true;
    const result = await shareSession(streak, total, duration);
    shareBtn.textContent = result === 'copied' ? t('הועתק', 'Copied') : orig;
    setTimeout(() => { shareBtn.textContent = orig; shareBtn.disabled = false; }, 1500);
  };

  const continueBtn = el('button', `flex:2;appearance:none;border:none;background:${T.accent};color:${T.accentT};border-radius:6px;padding:18px 22px;font-family:${T.display};font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;justify-content:center;gap:10px;`);
  continueBtn.innerHTML = `${iconCheck(T.accentT)} ${t('המשך', 'Continue')}`;
  continueBtn.onclick = () => {
    if (sessionRating != null) {
      const sessions = loadSessions();
      const si = sessions.findIndex(s => s.key === sessionKey && s.at === (sessions[sessions.length - 1]?.key === sessionKey ? sessions[sessions.length - 1].at : s.at));
      const lastIdx = sessions.length - 1;
      if (lastIdx >= 0 && sessions[lastIdx].key === sessionKey) { sessions[lastIdx].rating = sessionRating; saveSessions(sessions); }
    }
    const ns2 = nextSession();
    state.week = ns2.week; state.day = ns2.day;
    state.view = 'home';
    render();
  };
  ctaWrap.append(shareBtn, continueBtn);

  root.append(scroll, ctaWrap);
}

// ═══════════════════════════════════════════════════════
// PROGRAM
// ═══════════════════════════════════════════════════════
function renderProgram(root) {
  const hdr = el('div', `padding:calc(env(safe-area-inset-top,12px)+12px) 22px 12px;display:flex;align-items:center;gap:14px;flex-shrink:0;`);
  const backBtn = el('button', `appearance:none;border:1px solid ${T.hairline};background:transparent;color:${T.fg};width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;`);
  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" stroke="${T.fg}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,2 4,7 10,12"/></svg>`;
  backBtn.onclick = () => { state.view = 'home'; render(); };
  const title = el('div', `font-family:${T.display};font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:0.5px;`);
  title.textContent = t('תוכנית 4 השבועות', '4-week program');
  const langWrap = el('div', `margin-inline-start:auto;`);
  langWrap.appendChild(langButton());
  hdr.append(backBtn, title, langWrap);

  const scroll = el('div', `flex:1;overflow-y:auto;padding:0 22px;`);
  const body = el('div', `display:flex;flex-direction:column;gap:28px;padding-bottom:40px;margin-top:8px;`);

  // All 3 weekly sessions are the same Baduanjin set, so the breakdown is
  // shown once rather than repeated identically per day slot.
  const day = PROGRAM.days[0];
  const daySection = el('div', ``);
  const dayHdr = el('div', `margin-bottom:14px;`);
  const dayTag = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.accent};letter-spacing:2px;text-transform:uppercase;`);
  dayTag.textContent = `${t(day.tag, day.tagEn)} · ${t('מתורגל 3 פעמים בשבוע', 'practiced 3 times a week')}`;
  const dayTitleEl = el('div', `font-family:${T.display};font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:-0.5px;line-height:1;margin-top:4px;`);
  dayTitleEl.textContent = t(day.title, day.titleEn);
  const daySub = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};margin-top:4px;letter-spacing:1px;`);
  daySub.textContent = t(day.kicker, day.kickerEn);
  dayHdr.append(dayTag, dayTitleEl, daySub);

  const phaseList = el('div', `display:flex;flex-direction:column;gap:6px;`);
  day.phases.forEach((ph, pi) => {
    const phCard = el('div', `background:${T.card};border:1px solid ${T.hairline};border-radius:6px;padding:14px;`);
    const phHdr = el('div', `display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;`);
    const phName = el('div', `font-family:${T.display};font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:0.5px;`);
    phName.textContent = `${pi + 1}. ${t(ph.name, ph.nameEn)}`;
    const phIntent = el('div', `font-family:${T.mono_ff};font-size:10px;color:${T.mono};letter-spacing:0.5px;max-width:200px;text-align:right;`);
    phIntent.textContent = t(ph.intent, ph.intentEn);
    phHdr.append(phName, phIntent);

    const exList = el('div', `display:flex;flex-direction:column;gap:4px;`);
    ph.exercises.forEach(ex => {
      const row = el('div', `display:flex;align-items:baseline;gap:8px;`);
      const name = el('span', `font-size:13px;color:${T.fg};`);
      name.textContent = exName(ex);
      const week1 = el('span', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};margin-left:auto;flex-shrink:0;`);
      week1.textContent = t(`שבוע 1: ${ex.variants[0]}`, `Week 1: ${variantText(ex.variants[0])}`);
      row.append(name, week1);
      exList.appendChild(row);
    });
    phCard.append(phHdr, exList);
    phaseList.appendChild(phCard);
  });

  daySection.append(dayHdr, phaseList);
  body.appendChild(daySection);
  body.appendChild(renderProgressGrid());

  scroll.appendChild(body);
  root.append(hdr, scroll);
}

// ═══════════════════════════════════════════════════════
// EXERCISES — learn the 8 movements once, before the daily practice.

  backBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" stroke="${T.fg}" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="10,2 4,7 10,12"/></svg>`;
  backBtn.onclick = () => { state.view = 'home'; render(); };
  const title = el('div', `font-family:${T.display};font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:0.5px;line-height:1.05;`);
  title.textContent = t('ללמוד את התנועות', 'Learn the movements');
  const langWrap = el('div', `margin-inline-start:auto;`);
  langWrap.appendChild(langButton());
  hdr.append(backBtn, title, langWrap);

  const scroll = el('div', `flex:1;overflow-y:auto;padding:0 22px;`);
  const body = el('div', `display:flex;flex-direction:column;gap:16px;padding-bottom:40px;margin-top:8px;`);

  const intro = el('div', `font-size:14px;color:${T.sub};line-height:1.6;`);
  intro.textContent = t(
    'צפו בכל קליפ פעם אחת לפני האימון הראשון. כך באימון היומי אתם כבר יודעים מה לעשות, והקליפ שם רק כתזכורת. הנגן עוצר אחרי דקה.',
    'Watch each clip once before your first session. Then in the daily practice you already know what to do, and the clip is only a reminder. The player stops after 1 minute.');

    const card = el('div', `background:${T.card};border:1px solid ${T.hairline};border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;`);

    const top = el('div', `display:flex;align-items:baseline;gap:12px;`);
    const num = el('div', `font-family:${T.mono_ff};font-size:12px;color:${T.accent};letter-spacing:1.5px;flex-shrink:0;`);
    num.textContent = String(i + 1).padStart(2, '0');
    const names = el('div', `display:flex;flex-direction:column;gap:3px;min-width:0;`);
    const main = el('div', `font-family:${T.display};font-weight:700;font-size:20px;line-height:1.05;letter-spacing:-0.3px;`);
    main.textContent = exName(ex);
    const other = el('div', `font-family:${T.mono_ff};font-size:11px;color:${T.mono};letter-spacing:0.5px;`);
    other.textContent = LANG === 'en' ? ex.name : ex.nameEn;
    names.append(main, other);
    top.append(num, names);

    const benefit = el('div', `font-size:13px;color:${T.sub};line-height:1.5;`);
    benefit.textContent = t(ph.intent, ph.intentEn);

    const how = el('div', `font-size:14px;color:${T.fg};line-height:1.65;`);
    how.textContent = descOf(info);

    card.append(top, benefit, how, renderClip(ex.clips));
    body.appendChild(card);
  });

  scroll.appendChild(body);
  root.append(hdr, scroll);
}

// ═══════════════════════════════════════════════════════
// SOUND
// ═══════════════════════════════════════════════════════
async function beep() {
  try {
    const ctx = getAudioCtx();
    if (ctx.state !== 'running') await ctx.resume();
    const t = ctx.currentTime + 0.05;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(660, t);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.start(t); o.stop(t + 0.4);
    if (navigator.vibrate) navigator.vibrate([60, 30, 60]);
  } catch {}
}
async function beepTick(freq) {
  try {
    const ctx = getAudioCtx();
    if (ctx.state !== 'running') await ctx.resume();
    const t = ctx.currentTime + 0.05;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.start(t); o.stop(t + 0.17);
  } catch {}
}

applyLang();
render();
